<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1e1e1e;
    --text: #e0e0e0;
    --muted: #555;
    --accent: #7c5cfc;
    --accent2: #c07af6;
    --tab-h: 48px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0f0f0;
      --surface: #fff;
      --border: #ddd;
      --text: #111;
      --muted: #999;
    }
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--surface);
    z-index: 100;
  }

  /* ── TABS ── */
  #tabs {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    height: var(--tab-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    z-index: 90;
    user-select: none;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    transition: color .15s;
    position: relative;
  }
  .tab-btn.active { color: var(--accent2); }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    bottom: 0; left: 20%; right: 20%;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }

  /* ── PANELS ── */
  .panel {
    position: fixed;
    top: calc(var(--tab-h) + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
    flex-direction: column;
    background: var(--bg);
  }
  .panel.active { display: flex; }

  /* ── TOOLBAR ── */
  .toolbar {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .toolbar input[type="text"],
  .toolbar input[type="url"] {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn.ghost {
    background: none;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent); }
  label.btn { display: inline-flex; align-items: center; }
  input[type="file"] { display: none; }

  /* ── WEBTOON ── */
  #webtoon-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  #webtoon-strip {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 0;
  }
  .wt-img {
    width: 100%;
    max-width: 720px;
    display: block;
    margin: 0 auto;
    image-rendering: auto;
  }
  #wt-empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #wt-empty svg { opacity: .25; }

  /* ── PDF ── */
  #pdf-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #pdf-strip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 0;
    width: 100%;
  }
  .pdf-page-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    background: var(--bg);
  }
  .pdf-page-wrap canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }
  #pdf-empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #pdf-empty svg { opacity: .25; }
  #pdf-progress {
    display: none;
    position: fixed;
    top: calc(var(--tab-h) + env(safe-area-inset-top,0px) + 56px);
    left: 0; right: 0;
    height: 2px;
    background: var(--border);
    z-index: 80;
  }
  #pdf-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width .1s;
  }
  #pdf-info {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 12px;
    text-align: center;
    flex-shrink: 0;
  }
  #pdf-scale-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #pdf-scale-wrap label { font-size: 12px; color: var(--muted); }
  #pdf-scale {
    width: 70px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px;
  }
</style>
</head>
<body>

<div id="tabs">
  <button class="tab-btn active" onclick="switchTab('webtoon')">Webtoon</button>
  <button class="tab-btn" onclick="switchTab('pdf')">PDF</button>
</div>

<!-- WEBTOON PANEL -->
<div id="panel-webtoon" class="panel active">
  <div class="toolbar">
    <input type="url" id="wt-url" placeholder="URL da imagem (Enter para adicionar)">
    <button class="btn" onclick="addWtUrl()">+</button>
    <label class="btn ghost">
      📁 Arquivos
      <input type="file" id="wt-file" accept="image/*" multiple onchange="addWtFiles(this)">
    </label>
    <button class="btn ghost" onclick="clearWebtoon()">Limpar</button>
  </div>
  <div id="webtoon-scroll">
    <div id="webtoon-strip">
      <div id="wt-empty">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="4" width="48" height="56" rx="4" stroke="currentColor" stroke-width="2"/>
          <rect x="16" y="14" width="32" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="16" y1="42" x2="48" y2="42" stroke="currentColor" stroke-width="1.5"/>
          <line x1="16" y1="50" x2="36" y2="50" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Adicione imagens via URL ou arquivo para começar a leitura.
      </div>
    </div>
  </div>
</div>

<!-- PDF PANEL -->
<div id="panel-pdf" class="panel">
  <div class="toolbar">
    <label class="btn">
      📂 Abrir PDF
      <input type="file" id="pdf-file" accept="application/pdf" onchange="loadPdfFile(this)">
    </label>
    <div id="pdf-scale-wrap">
      <label for="pdf-scale">Zoom</label>
      <select id="pdf-scale" onchange="rerenderPdf()">
        <option value="0.7">70%</option>
        <option value="1.0" selected>100%</option>
        <option value="1.3">130%</option>
        <option value="1.6">160%</option>
        <option value="2.0">200%</option>
        <option value="fit">Ajustar</option>
      </select>
    </div>
    <div id="pdf-info"></div>
  </div>
  <div id="pdf-progress"><div id="pdf-progress-bar"></div></div>
  <div id="pdf-scroll">
    <div id="pdf-strip">
      <div id="pdf-empty">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="2" width="44" height="56" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M22 18h20M22 26h20M22 34h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M36 46l6-6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="42" y1="40" x2="42" y2="54" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Abra um arquivo PDF para leitura contínua.
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ── init PDF.js ──
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ── TAB SWITCH ──
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['webtoon','pdf'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

// ══ WEBTOON ══
const strip = document.getElementById('webtoon-strip');
const wtEmpty = document.getElementById('wt-empty');
let wtCount = 0;

function showEmpty(state) {
  wtEmpty.style.display = state ? '' : 'none';
}

function addImage(src) {
  if (wtEmpty.parentNode) wtEmpty.style.display = 'none';
  const img = document.createElement('img');
  img.className = 'wt-img';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.src = src;
  img.alt = '';
  img.draggable = false;
  strip.appendChild(img);
  wtCount++;
}

function addWtUrl() {
  const input = document.getElementById('wt-url');
  const url = input.value.trim();
  if (!url) return;
  addImage(url);
  input.value = '';
  input.focus();
}

document.getElementById('wt-url').addEventListener('keydown', e => {
  if (e.key === 'Enter') addWtUrl();
});

function addWtFiles(input) {
  const files = [...input.files];
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  files.forEach(f => {
    const url = URL.createObjectURL(f);
    addImage(url);
  });
  input.value = '';
}

function clearWebtoon() {
  strip.innerHTML = '';
  strip.appendChild(wtEmpty);
  wtEmpty.style.display = '';
  wtCount = 0;
}

// ══ PDF ══
let pdfDoc = null;
let pdfBytes = null;

async function loadPdfFile(input) {
  const file = input.files[0];
  if (!file) return;
  pdfBytes = await file.arrayBuffer();
  input.value = '';
  await renderPdf(pdfBytes);
}

async function renderPdf(bytes) {
  if (!window.pdfjsLib) { alert('PDF.js não carregou. Verifique sua conexão.'); return; }
  const pdfStrip = document.getElementById('pdf-strip');
  const pdfEmpty = document.getElementById('pdf-empty');
  const progress = document.getElementById('pdf-progress');
  const progressBar = document.getElementById('pdf-progress-bar');
  const info = document.getElementById('pdf-info');

  // clear
  pdfStrip.innerHTML = '';
  progress.style.display = 'block';
  progressBar.style.width = '0%';

  const scaleEl = document.getElementById('pdf-scale');
  const scaleVal = scaleEl.value;

  try {
    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    const total = pdfDoc.numPages;
    info.textContent = total + ' página' + (total !== 1 ? 's' : '');

    for (let i = 1; i <= total; i++) {
      const page = await pdfDoc.getPage(i);
      let scale;
      if (scaleVal === 'fit') {
        const vp0 = page.getViewport({ scale: 1 });
        const panelW = document.getElementById('pdf-scroll').clientWidth;
        scale = panelW / vp0.width;
      } else {
        scale = parseFloat(scaleVal);
      }
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      const wrap = document.createElement('div');
      wrap.className = 'pdf-page-wrap';
      wrap.appendChild(canvas);
      pdfStrip.appendChild(wrap);
      await page.render({ canvasContext: ctx, viewport }).promise;
      progressBar.style.width = ((i / total) * 100) + '%';
    }
  } catch (err) {
    pdfStrip.innerHTML = '<div id="pdf-empty" style="margin:auto;padding:60px 24px;text-align:center;color:var(--muted)">Erro ao abrir PDF: ' + err.message + '</div>';
  }
  progress.style.display = 'none';
}

async function rerenderPdf() {
  if (pdfBytes) await renderPdf(pdfBytes);
}
</script>
</body>
</html>
